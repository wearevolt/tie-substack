name: extension

# Builds the Claude Desktop extension (build_mcpb.sh; macOS and Windows), then starts it on both the
# way Claude Desktop does (uv sync + uv run in the unpacked folder): initialize and tools/list must
# answer. On a pull request and by hand it is a downloadable artifact; on a v* tag, once the smoke
# runs pass, it goes to that tag's GitHub release (created if missing), so
# .../releases/latest/download/tie-substack.mcpb is the stable link.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build tie-substack.mcpb
        run: ./build_mcpb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tie-substack
          path: dist/tie-substack.mcpb

  smoke:
    needs: build
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: tie-substack
      - name: Start it as Claude Desktop does
        run: |
          python -m zipfile -e tie-substack.mcpb ext
          uv sync --quiet --directory ext
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | TIE_SUBSTACK_HOME="$RUNNER_TEMP/home" uv run --directory ext server.py > out.jsonl
          python - <<'EOF'
          import json
          msgs = {m.get("id"): m for m in map(json.loads, open("out.jsonl"))}
          info, tools = msgs[1]["result"]["serverInfo"], msgs[2]["result"]["tools"]
          print(info, len(tools), "tools")
          assert info["name"] == "tie-substack" and len(tools) > 20, (info, len(tools))
          EOF

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tie-substack
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Claude Desktop extension for macOS and Windows: tie-substack.mcpb, Settings -> Desktop app -> Extensions."
          gh release upload "${GITHUB_REF_NAME}" tie-substack.mcpb --clobber
